<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>마이챌린지 인증 리스트</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
            rel="stylesheet"
            as="style"
            crossorigin
            href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov.min.css"
    />
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
    />
    <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Roboto:wght@400;700;900&display=swap"
            rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/myChallenge/myChallengeList.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
</head>
<!---로그인 했을 때 + 사이드바---->
<body id="default" oncontextmenu="return false">

<div th:replace="common/header :: header"></div>
<div th:replace="common/sideBar :: sideBar"></div>

<!--여기부터 개발 시작--->
<div class="main">
    <div class="challenge-container">
        <div class="challenge-header">마이챌린지 인증글 목록</div>
        <div class="challenge-form">
            <div class="text-line"></div>
            <div class="form-row">
                <label for="title">챌린지명</label>
                <a type="text" id="title">배달음식 없는 하루 챌린지</a>
            </div>
            <div class="text-line"></div>

            <div class="mychallenge-section">
                <div class="mychallenge-box">
                    <a href="/usr/myChallenge/myChallengeContents">
                        <img src="https://cdn.newswin.co.kr/news/photo/202207/311064_313267_4613.jpg" alt="챌린지">
                    </a>
                </div>
            </div>

            <div class="text-line"></div>
            <div class="form-row">
                <label2 for="content">내용</label2>
            </div>

            <!-- 인증글 목록을 슬라이드로 표시 -->
            <div class="challenge-container">
                <div class="carousel-container">
                    <button class="carousel-button prev" onclick="moveSlide(-1)">&lt;</button>
                    <div class="carousel-wrapper" id="carousel">
                        <th:block th:each="myChallenge : ${myChallengeList}">
                            <div class="carousel-slide">
                                <img th:src="@{${myChallenge.uccImage}}" alt="인증 이미지">
                                <div class="mychallenge-label" th:text="${myChallenge.uccTitle}"></div>
                            </div>
                        </th:block>
                    </div>
                    <button class="carousel-button next" onclick="moveSlide(1)">&gt;</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="footer"></div>
</body>
<script>
    let index = 0;
    const slides = document.querySelectorAll(".carousel-slide");
    const wrapper = document.getElementById("carousel");

    function moveSlide(step) {
        const totalSlides = slides.length;
        const maxIndex = Math.ceil(totalSlides / 2) - 1;

        index += step;
        if (index < 0) index = 0;
        if (index > maxIndex) index = maxIndex;

        wrapper.style.transform = `translateX(-${index * 100}%)`;
    }

    // 빈칸 추가 (만약 이미지가 2개씩 안 맞을 경우)
    document.addEventListener("DOMContentLoaded", function () {
        const slideCount = slides.length;
        if (slideCount % 2 !== 0) {
            const emptySlide = document.createElement("div");
            emptySlide.classList.add("carousel-slide", "empty-slide");
            wrapper.appendChild(emptySlide);
        }
    });

    window.addEventListener("scroll", () => {
        const bwLeft = window.scrollX;
        document.querySelector(
            ".header-in"
        ).style.transform = `translateX(-${bwLeft}px)`;
    });
</script>
</html>
