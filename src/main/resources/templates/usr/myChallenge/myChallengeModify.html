<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>마이챌린지 수정</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
          rel="stylesheet"
          as="style"
          crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov.min.css"
  />
  <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
  />
  <link
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Roboto:wght@400;700;900&display=swap"
          rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/myChallenge/mychallengeModify.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<!---로그인 했을 때 + 사이드바---->
<body id="default" oncontextmenu="return false">

<div th:replace="common/header :: header"></div>
<div th:replace="common/sideBar :: sideBar"></div>

<!--여기부터 개발 시작--->
<div class="main">
  <div class="challenge-container">
    <div class="challenge-header">마이챌린지 인증글 수정</div>
    <div class="challenge-form">
      <form id="challengeForm" action="/usr/myChallenge/myChallengeModifyAction" method="post" enctype="multipart/form-data">

        <!-- ✅ 숨겨진 uccIdx (수정할 데이터의 ID) -->
        <input type="hidden" id="uccIdx" name="uccIdx" th:value="${myChallenge.uccIdx}" />

        <div class="text-line"></div>

        <div class="form-row">
          <label for="uccTitle">챌린지명</label>
          <input type="text" id="uccTitle" name="uccTitle" th:value="${myChallenge.uccTitle}" required />
        </div>

        <div class="text-line"></div>

        <div class="form-row">
          <label for="file">첨부파일</label>
          <input type="file" id="file" name="uploadFile" onchange="previewImage(event)" />
        </div>

        <!-- ✅ 기존 이미지 미리보기 -->
        <div class="text-line"></div>
        <div class="form-row">
          <p>현재 이미지:</p>
          <img th:if="${myChallenge.uccImage != null}" th:src="@{${myChallenge.uccImage}}" id="imagePreview" width="150" />
          <p th:if="${myChallenge.uccImage == null}">등록된 이미지가 없습니다.</p>
        </div>

        <div class="text-line"></div>

        <div class="form-row">
          <label for="uccContents">내용</label>
        </div>
        <div class="form-row">
          <textarea id="uccContents" name="uccContents" required th:text="${myChallenge.uccContents}"></textarea>
        </div>

        <div class="form-row">
          <button type="submit" class="submit-btn">수정</button>
        </div>

      </form>
    </div>
  </div>
</div>

<div class="footer"></div>
</body>
<script>
  function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function() {
      const imgElement = document.getElementById("imagePreview");
      imgElement.src = reader.result;
      imgElement.style.display = "block"; // 이미지 미리보기 보이게 함
    };
    reader.readAsDataURL(event.target.files[0]);
  }

  window.addEventListener("scroll", () => {
    const bwLeft = window.scrollX;
    document.querySelector(
            ".header-in"
    ).style.transform = `translateX(-${bwLeft}px)`;
  });
</script>
</html>
