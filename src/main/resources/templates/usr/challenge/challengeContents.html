        <div class="challenge-form">
            <div class="text-line"></div>
            <div class="form-row">
                <label>제목</label>
                <h2 th:text="${challenge.ciTitle}"></h2>
            </div>
            <div class="text-line"></div>
            <div class="form-row" style="display: flex; align-items: center; justify-content: center;">
                <div>
                    <!--                    <img src="https://health.chosun.com/site/data/img_dir/2021/03/04/2021030402822_0.jpg" alt="챌린지 이미지">-->

                </div>
            </div>
            <div class="text-line"></div>
            <div class="form-row">
                <label>기간</label>
                <div class="period-options">
                    <button type="button" class="period-button" data-period="7일"
                            th:classappend="${challenge.ciDuration == '7일' ? 'active' : ''}">7일
                    </button>
                    <button type="button" class="period-button" data-period="14일"
                            th:classappend="${challenge.ciDuration == '14일' ? 'active' : ''}">14일
                    </button>
                    <button type="button" class="period-button" data-period="30일"
                            th:classappend="${challenge.ciDuration == '30일' ? 'active' : ''}">1달
                    </button>
                </div>
                <input type="hidden" id="ciDuration" name="ciDuration" th:value="${challenge.ciDuration}"/>
            </div>
            <div class="text-line"></div>
            <div class="form-row">
                <label2 for="content">내용</label2>
            </div>
            <div class="form-row">
                <textarea id="content" name="ciContents" th:text="${challenge.ciContents}"></textarea>
            </div>
        </div>
    </div>
    <div class="footer"></div>
    <div class="text-line"></div>
    <div class="form-row" style="display: flex; justify-content: flex-end; gap: 10px;">
