<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>챌린지 상세보기</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
            rel="stylesheet"
            as="style"
            crossorigin
            href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov.min.css"
    />
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
    />
    <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Roboto:wght@400;700;900&display=swap"
            rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/challenge/challengeDetail.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<!---로그인 했을 때 + 사이드바---->
<body id="default" oncontextmenu="return false">

<div th:replace="common/header :: header"></div>
<div th:replace="common/sideBar :: sideBar"></div>

<!--여기부터 개발 시작--->
<div class="main">
    <div class="challenge-container">
        <div class="challenge-header">챌린지 상세보기</div>
        <div class="challenge-form">
            <div class="text-line"></div>
            <div class="form-row">
                <label for="title">제목</label>
                <h2 type="text" id="title">하루 2L 물 마시기 챌린지</h2>
            </div>
            <div class="text-line"></div>

            <div class="form-row" style="display: flex; align-items: center; justify-content: center;">
                <div>
                    <img src="https://health.chosun.com/site/data/img_dir/2021/03/04/2021030402822_0.jpg" alt="챌린지 이미지">
                </div>
            </div>

            <div class="text-line"></div>

            <div class="form-row">
                <label>기간</label>
                <div class="period-options">
                    <button>7일</button>
                    <button>14일</button>
                    <button class="active">1달</button>
                </div>
            </div>

            <div class="text-line"></div>
            <div class="form-row">
                <label2 for="content">내용</label2>
            </div>
            <div class="form-row">
                <textarea id="content"></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <a href="/usr/myChallenge/myChallengeWrite" class="form-row">
                    <button class="write-btn">글쓰기</button>
                </a>

                <a href="/usr/challenge/challengeList" class="form-row">
                    <button class="submit-btn">목록</button>
                </a>
            </div>

        </div>
    </div>
</div>

<div class="footer"></div>
</body>
<script>
    window.addEventListener("scroll", () => {
        const bwLeft = window.scrollX;
        document.querySelector(
            ".header-in"
        ).style.transform = `translateX(-${bwLeft}px)`;
    });
</script>
</html>
