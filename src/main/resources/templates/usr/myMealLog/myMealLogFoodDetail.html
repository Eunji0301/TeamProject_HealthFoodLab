          <input type="hidden" name="ftCalorie" id="formCalories">
          <input type="hidden" name="ftCarb" id="formCarb">
          <input type="hidden" name="ftProtein" id="formProtein">
          <input type="hidden" name="ftFat" id="formFat">
          <input type="hidden" name="ftSugar" id="formSugars">
          <input type="hidden" name="ftSodium" id="formSodium">
          <button type="button" id="saveButton" class="revbutton5-FA9058 w-full py-3 text-base font-bold">
            저장하기
          </button>
        </form>

      </div>

  <script>

    $(document).ready(function () {
      function fetchFoodDetails() {
        let selectedValue = $("#optionSelect").val(); // 현재 선택된 값 가져오기

=======
    $(document).ready(function(){
      $("#optionSelect").on("change", function(){

>>>>>>> Stashed changes
        $.ajax({
          url: "/usr/myMealLog/foodDetailCalculate",

          type: "POST",
          contentType: "application/json",
          data: JSON.stringify({
            value: selectedValue,
            foodDBResultJsonOneItem: foodDBResultJsonOneItem
          }),
          success: function (result) {
            console.log("AJAX 응답 데이터:", result);
            document.getElementById("perSevingInt").textContent = result.perSevingInt;
            document.getElementById("perServingUnit").textContent = result.perServingUnit;
            document.getElementById("calories").textContent = result.calories;
            document.getElementById("carb").textContent = result.carb;
            document.getElementById("protein").textContent = result.protein;
            document.getElementById("fat").textContent = result.fat;
            document.getElementById("sugars").textContent = result.sugars;
            document.getElementById("sodium").textContent = result.sodium;
            document.getElementById("carbPercent").textContent = result.carbPercent;
            document.getElementById("proteinPercent").textContent = result.proteinPercent;
            document.getElementById("fatPercent").textContent = result.fatPercent;
            document.getElementById("sugarsPercent").textContent = result.sugarsPercent;
            document.getElementById("sodiumPercent").textContent = result.sodiumPercent;

            document.getElementById("formSelectedValue").value = selectedValue;
            document.getElementById("formPerSevingInt").value = result.perSevingInt;
            document.getElementById("formCalories").value = result.calories;
            document.getElementById("formCarb").value = result.carb;
            document.getElementById("formProtein").value = result.protein;
            document.getElementById("formFat").value = result.fat;
            document.getElementById("formSugars").value = result.sugars;
            document.getElementById("formSodium").value = result.sodium;

            document.querySelectorAll("[data-type]").forEach(graphBar => {
              let type = graphBar.getAttribute("data-type"); // 그래프 유형 가져오기
              let percentValue = result[`${type}Percent`]; // AJAX 응답에서 해당하는 값 가져오기

              if (percentValue !== undefined) {
                graphBar.style.setProperty("--percent", percentValue + "%");
              }
            });
          },
          error: function () {
            alert("B 서버 요청 중 오류 발생");
          }
        });
      }

      // 🔹 페이지 로드 시 AJAX 요청 실행
      fetchFoodDetails();

      // 🔹 사용자가 select 변경 시 AJAX 요청 실행
      $("#optionSelect").on("change", fetchFoodDetails);
    });

    document.getElementById("saveButton").addEventListener("click", function() {
      document.getElementById("saveForm").submit();
    });
  </script>
