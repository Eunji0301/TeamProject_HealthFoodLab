<script>
    const foodNutrition = {
        "빵": { calorie: 265, carb: 49, protein: 9, fat: 3, sugar: 5, fiber: 2, cholesterol: 35, sodium: 500 },
        "밥": { calorie: 130, carb: 28, protein: 2, fat: 0.3, sugar: 0, fiber: 0.4, cholesterol: 0, sodium: 1 },
        "탕": { calorie: 80, carb: 10, protein: 7, fat: 2, sugar: 3, fiber: 1, cholesterol: 25, sodium: 600 },
        "국": { calorie: 50, carb: 7, protein: 5, fat: 1, sugar: 2, fiber: 1, cholesterol: 10, sodium: 450 },
        "찌개": { calorie: 120, carb: 8, protein: 10, fat: 5, sugar: 4, fiber: 1, cholesterol: 30, sodium: 700 },
        "면": { calorie: 220, carb: 40, protein: 8, fat: 4, sugar: 1, fiber: 2, cholesterol: 10, sodium: 300 },
        "해산물": { calorie: 85, carb: 0, protein: 18, fat: 1, sugar: 0, fiber: 0, cholesterol: 50, sodium: 300 },
        "두부": { calorie: 76, carb: 1.9, protein: 8, fat: 4.8, sugar: 0.3, fiber: 0.5, cholesterol: 0, sodium: 8 },
        "고기": { calorie: 250, carb: 0, protein: 26, fat: 15, sugar: 0, fiber: 0, cholesterol: 70, sodium: 75 },
        "유제품": { calorie: 110, carb: 12, protein: 8, fat: 4, sugar: 12, fiber: 0, cholesterol: 20, sodium: 125 },
        "달걀": { calorie: 155, carb: 1.1, protein: 13, fat: 11, sugar: 1.1, fiber: 0, cholesterol: 373, sodium: 140 },
        "채소": { calorie: 25, carb: 5.5, protein: 2, fat: 0.2, sugar: 2.5, fiber: 3, cholesterol: 0, sodium: 30 },
        "디저트": { calorie: 400, carb: 60, protein: 5, fat: 15, sugar: 40, fiber: 2, cholesterol: 30, sodium: 200 },
        "견과류": { calorie: 600, carb: 20, protein: 18, fat: 50, sugar: 5, fiber: 8, cholesterol: 0, sodium: 2 },
        "과일": { calorie: 50, carb: 13, protein: 1, fat: 0.2, sugar: 10, fiber: 2, cholesterol: 0, sodium: 1 },
        "전/튀김": { calorie: 350, carb: 40, protein: 10, fat: 20, sugar: 2, fiber: 1, cholesterol: 40, sodium: 500 },
        "볶음/덮밥": { calorie: 280, carb: 35, protein: 12, fat: 10, sugar: 5, fiber: 3, cholesterol: 30, sodium: 400 },
        "해조류": { calorie: 30, carb: 6, protein: 3, fat: 0.5, sugar: 2, fiber: 3, cholesterol: 0, sodium: 150 }
    };

    $(document).ready(function () {
        $("#submitBtn").click(function () {
            /*alert("📌 2_3 페이지에서 최종 데이터 서버로 전송 시작!");*/

            // 🟢 기존 sessionStorage에서 저장된 servings 데이터 불러오기
            let storedMealData = sessionStorage.getItem("mealData");
            let mealData = storedMealData ? JSON.parse(storedMealData) : {};

            console.log("🔍 기존 sessionStorage 데이터 (servings 값만 저장됨):", mealData);

            // 🟢 마지막 페이지에서 음식 카테고리와 선택 횟수 추가
            $(".food-item").each(function () {
                let foodName = $(this).find("p").text().trim();
                let servings = parseInt($(this).find("select").val()) || 0;

                // servings가 0 이상일 때만 저장
                if (servings > 0) {
                    mealData[foodName] = (mealData[foodName] || 0) + servings; // 기존 값과 누적
                }
            });

            // 🟢 최종적으로 영양소 계산
            let totalMealData = {
                mCalorie: 0, mCarb: 0, mProtein: 0, mFat: 0, mSugar: 0,
                mFiber: 0, mCholesterol: 0, mSodium: 0
            };

            Object.keys(mealData).forEach(foodName => {
                let servings = mealData[foodName];

                if (foodNutrition[foodName]) {
                    let nutrition = foodNutrition[foodName];

                    totalMealData.mCalorie += nutrition.calorie * servings;
                    totalMealData.mCarb += nutrition.carb * servings;
                    totalMealData.mProtein += nutrition.protein * servings;
                    totalMealData.mFat += nutrition.fat * servings;
                    totalMealData.mSugar += nutrition.sugar * servings;
                    totalMealData.mFiber += nutrition.fiber * servings;
                    totalMealData.mCholesterol += nutrition.cholesterol * servings;
                    totalMealData.mSodium += nutrition.sodium * servings;
                }
            });

            // 🟢 소수점 두 자리까지 처리
            totalMealData.mCalorie = totalMealData.mCalorie.toFixed(2);
            totalMealData.mCarb = totalMealData.mCarb.toFixed(2);
            totalMealData.mProtein = totalMealData.mProtein.toFixed(2);
            totalMealData.mFat = totalMealData.mFat.toFixed(2);
            totalMealData.mSugar = totalMealData.mSugar.toFixed(2);
            totalMealData.mFiber = totalMealData.mFiber.toFixed(2);
            totalMealData.mCholesterol = totalMealData.mCholesterol.toFixed(2);
            totalMealData.mSodium = totalMealData.mSodium.toFixed(2);

            /*alert("✅ 2_3에서 추가 입력 포함한 최종 데이터: \n" + JSON.stringify(totalMealData));*/

            // 🟢 최종적으로 서버로 전송
            $.ajax({
                type: "POST",
                url: "/usr/diagnosis/analyzeNutrition",  // 변경된 URL로 서버에 요청
                contentType: "application/json",
                data: JSON.stringify({
                    uIdx: 1,
                    mCalorie: totalMealData.mCalorie,
                    mCarb: totalMealData.mCarb,
                    mProtein: totalMealData.mProtein,
                    mFat: totalMealData.mFat,
                    mSugar: totalMealData.mSugar,
                    mFiber: totalMealData.mFiber,
                    mCholesterol: totalMealData.mCholesterol,
                    mSodium: totalMealData.mSodium
                }),
                beforeSend: function () {
                    console.log("🚀 서버로 전송할 최종 JSON 데이터:", JSON.stringify(totalMealData, null, 2));
                },
                success: function (response) {
                    console.log("✅ 서버 응답 (JSON):", response);
                    /*alert("✅ 서버 응답 성공: " + JSON.stringify(response));*/
                    sessionStorage.removeItem("mealData");
                    window.location.href = "/usr/diagnosis/DiagnosisResult";
                },
                error: function (xhr, status, error) {
                    console.error("❌ 식사 기록 저장 실패:", error);
                    console.error("❌ 상태 코드:", xhr.status);
                    console.error("❌ 응답 본문:", xhr.responseText);
                    /*alert("❌ 서버 응답 실패! \n에러: " + xhr.responseText + "\n 상태 코드: " + xhr.status);*/
                }
            });
        });
    });
</script>
