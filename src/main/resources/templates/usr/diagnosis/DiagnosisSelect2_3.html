<script type="module">
    import foodNutrition from "/js/foodNutrition.js";

    $(document).ready(function () {
        $("#submitBtn").click(function () {
            alert("📌 2_3 페이지에서 최종 데이터 서버로 전송 시작!");

            // 🟢 기존 sessionStorage에서 저장된 servings 데이터 불러오기
            let storedMealData = sessionStorage.getItem("mealData");
            let mealData = storedMealData ? JSON.parse(storedMealData) : {};

            console.log("🔍 기존 sessionStorage 데이터 (servings 값만 저장됨):", mealData);

            // 🟢 최종적으로 영양소 계산
            let totalMealData = {
                mCalorie: 0, mCarb: 0, mProtein: 0, mFat: 0, mSugar: 0,
                mFiber: 0, mCholesterol: 0, mSodium: 0
            };

            Object.keys(mealData).forEach(foodName => {
                let servings = mealData[foodName];

                if (foodNutrition[foodName]) {
                    let nutrition = foodNutrition[foodName];

                    totalMealData.mCalorie += nutrition.calorie * servings;
                    totalMealData.mCarb += nutrition.carb * servings;
                    totalMealData.mProtein += nutrition.protein * servings;
                    totalMealData.mFat += nutrition.fat * servings;
                    totalMealData.mSugar += nutrition.sugar * servings;
                    totalMealData.mFiber += nutrition.fiber * servings;
                    totalMealData.mCholesterol += nutrition.cholesterol * servings;
                    totalMealData.mSodium += nutrition.sodium * servings;
                }
            });

            alert("✅ 2_3에서 추가 입력 포함한 최종 데이터: \n" + JSON.stringify(totalMealData));

            // 🟢 최종적으로 서버로 전송
            $.ajax({
                type: "POST",
                url: "/usr/diagnosis/submitAllMeal",
                contentType: "application/json",
                data: JSON.stringify(totalMealData),
                beforeSend: function () {
                    console.log("🚀 서버로 전송할 최종 JSON 데이터:", JSON.stringify(totalMealData, null, 2));
                },
                success: function (response) {
                    console.log("✅ 서버 응답 (JSON):", response);
                    alert("✅ 서버 응답 성공: " + JSON.stringify(response));
                    sessionStorage.removeItem("mealData");
                    window.location.href = "/usr/diagnosis/DiagnosisResult";
                },
                error: function (xhr, status, error) {
                    console.error("❌ 식사 기록 저장 실패:", error);
                    console.error("❌ 상태 코드:", xhr.status);
                    console.error("❌ 응답 본문:", xhr.responseText);
                    alert("❌ 서버 응답 실패! \n에러: " + JSON.stringify(error) + "\n 상태 코드: " + xhr.status);
                }
            });
        });
    });
</script>
