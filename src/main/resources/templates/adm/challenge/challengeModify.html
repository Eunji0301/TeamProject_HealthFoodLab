<!--여기부터 개발 시작--->
<div class="main">
    <div class="challenge-container">
        <div class="challenge-header">챌린지 수정</div>
        <div class="challenge-form">
            <div class="text-line"></div>
            <form action="/adm/challenge/challengeModifyAction" method="POST" enctype="multipart/form-data">
                <input th:type="hidden" name="ciIdx" th:value="${challenge.ciIdx}">
                <div class="form-row">
                    <label for="title">제목</label>
                    <input type="text" id="title" name="ciTitle"
                           th:placeholder="${challenge.ciTitle != null ? challenge.ciTitle : '제목을 입력하세요.'}"/>
                </div>
                <div class="text-line"></div>
                <div class="form-row">
                    <label>기간</label>
                    <div class="period-options">
                        <button type="button" class="period-button" data-period="7일">7일</button>
                        <button type="button" class="period-button" data-period="14일">14일</button>
                        <button type="button" class="period-button active" data-period="30일">1달</button>
                    </div>
                    <input type="hidden" id="ciDuration" name="ciDuration" value="30일"/>
                </div>
                <div class="text-line"></div>
                <div class="form-row">
                    <!--                <img src="https://www.kdca.go.kr/html/a2/namoimage/images/000171/%ED%95%B4%EC%99%B8%EC%97%AC%ED%96%89_%EC%8B%9C_%EC%A7%80%EC%BC%9C%EC%95%BC_%ED%95%A0_%ED%98%B8%ED%9D%A1%EA%B8%B0_%EA%B0%90%EC%97%BC%EB%B3%91_%EC%98%88%EB%B0%A9%EC%88%98%EC%B9%99-%EA%B5%AD%EB%AC%B8.jpg" alt="물 2L 마시기">-->
                    <img th:src="${challenge.ciImage}" alt="카드뉴스 이미지"/>
                </div>
                <div class="text-line"></div>
                <div class="form-row">
                    <img id="previewImage" src="" alt="미리보기 이미지" style="max-width: 300px; display: none;"/>
                </div>
                <div class="text-line"></div>
                <div class="form-row">
                    <label>첨부파일</label>
                    <!--                <div>챌린지222.png</div>-->
                    <input type="file" id="uploadFile" name="uploadFile"/>
                    <!--                <input type="text" id="ciFilename" name="ciFilename"/>-->
                    <input type="hidden" id="ciFilename" name="ciFilename"/>
                </div>
                <div class="text-line"></div>
                <div class="form-row">
                    <label2 for="content">내용</label2>
                </div>
                <div class="form-row">
                    <textarea id="content" name="ciContents" th:placeholder="${challenge.ciContents != null ? challenge.ciContents : '내용을 입력하세요.'}"></textarea>
                </div>
                <div class="form-row">
                    <button class="submit-btn">수정</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="footer"></div>
</body>
<script>
    window.addEventListener("scroll", () => {
        const bwLeft = window.scrollX;
        document.querySelector(
            ".header-in"
        ).style.transform = `translateX(-${bwLeft}px)`;
    });

    // 기간 버튼 클릭 시
    document.querySelectorAll('.period-button').forEach(button => {
        button.addEventListener('click', function () {
            // 모든 버튼에서 active 클래스를 제거
            document.querySelectorAll('.period-button').forEach(btn => btn.classList.remove('active'));

            // 클릭한 버튼에 active 클래스 추가
            this.classList.add('active');

            // 클릭한 버튼의 data-period 값을 ciDuration hidden 필드에 저장
            document.getElementById('ciDuration').value = this.getAttribute('data-period');
        });
    });

    document.getElementById("uploadFile").addEventListener("change", function (event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const preview = document.getElementById("previewImage");
                preview.src = e.target.result;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);
        }
    });

    // 파일 업로드 후 미리보기 이미지 업데이트
    function uploadImage() {
        const fileInput = document.getElementById("uploadFile");
        if (fileInput.files.length === 0) {
            alert("업로드할 파일을 선택하세요.");
            return;
        }

        const formData = new FormData();
        formData.append("uploadFile", fileInput.files[0]);

        fetch("/adm/challenge/challengeModifyAction", {  // 실제 업로드할 서버 경로로 변경 필요
            method: "POST",
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert("이미지 업로드 성공!");
                    // 서버에서 반환된 파일 경로로 미리보기 이미지 업데이트
                    document.getElementById("previewImage").src = data.imagePath;  // 서버에서 반환한 이미지 경로로 설정
                    document.getElementById("ciFilename").value = data.filename;   // 파일명 저장
                } else {
                    alert("이미지 업로드 실패");
                }
            })
            .catch(error => console.error("Error:", error));
    }
</script>
</html>
